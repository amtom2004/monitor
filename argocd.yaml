apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
 name: monitor
 namespace: argocd
spec:
 project: default
 source:
  repoURL: https://github.com/amtom2004/monitor
  targetRevision: HEAD
  path: k8s-manifests
 destination:
  server: https://kubernetes.default.svc
  namespace: monitor
 syncPolicy:
  automated:
   prune: true
   selfHeal: true
  syncOptions:
  - CreateNamespace=true